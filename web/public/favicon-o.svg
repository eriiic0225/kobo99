<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- 1. 底部翻開的書本 -->
  <!-- 書本右下角黑色硬陰影 -->
  <rect x="29" y="44" width="70" height="46" rx="2" fill="#000000" />
  <!-- 書本主體 -->
  <rect x="25" y="40" width="70" height="46" rx="2" fill="#FFFFFF" stroke="#000000" stroke-width="5" />
  <!-- 書本中縫線 -->
  <path d="M60 40 L60 86" stroke="#000000" stroke-width="4" />
  
  <!-- 2. 靈魂傾斜貼紙（保持 -12 度斜角） -->
  <g transform="rotate(-12 60 40)">
    <!-- 貼紙右下角硬陰影 -->
    <rect x="36" y="24" width="52" height="32" fill="#000000" />
    <!-- 貼紙主體 -->
    <rect x="32" y="20" width="52" height="32" fill="#FF5A60" stroke="#000000" stroke-width="4" />
    
    <!-- 3. 核心粗體字 99（y 軸上調至 35.5，完美對齊視覺置中） -->
    <text x="58" y="35.5" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">99</text>
  </g>
</svg>
