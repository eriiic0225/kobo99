<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 1. 底部翻開的書本 -->
  <!-- 書本右下角硬陰影 -->
  <rect x="14" y="44" width="82" height="52" rx="4" fill="#000000" />
  <!-- 書本主體 -->
  <rect x="8" y="38" width="82" height="52" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="8" />
  <!-- 書本中縫線 -->
  <path d="M49 38 L49 90" stroke="#000000" stroke-width="6" />
  
  <!-- 2. 巨型靈魂傾斜貼紙 -->
  <g transform="rotate(-10 50 35)">
    <!-- 貼紙右下角硬陰影 -->
    <rect x="13" y="2" width="82" height="48" fill="#000000" />
    <!-- 貼紙主體 -->
    <rect x="5" y="-6" width="82" height="48" fill="#FF5A60" stroke="#000000" stroke-width="8" />
    
    <!-- 3. 頂天立地 99（y 軸再往上挪到 19.5，徹底修正偏下問題） -->
    <text x="46" y="19.5" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="38" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">99</text>
  </g>
</svg>
